services:
  - type: web
    name: nivra-medicine-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: NIVRA_SECRET_KEY
        generateValue: true
      - key: NIVRA_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
